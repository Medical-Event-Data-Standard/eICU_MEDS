name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    # The e2e test downloads the full eICU demo (~200 MB over PhysioNet's
    # per-connection rate limit) before extracting ~30M events, so 30 minutes is
    # not enough headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      # Cache the raw eICU demo download. The key tracks the source spec, and the
      # prefix fallback restores the previous cache when it changes: every demo file
      # is sha256-verified on download, so only changed or missing files are refetched.
      - name: Cache eICU demo download
        uses: actions/cache@v4
        with:
          path: ~/.cache/eICU_MEDS/demo_raw
          key: eicu-demo-raw-${{ hashFiles('src/eICU_MEDS/configs/event_configs.yaml') }}
          restore-keys: eicu-demo-raw-

      - name: Run tests
        env:
          EICU_MEDS_DEMO_RAW_DIR: ~/.cache/eICU_MEDS/demo_raw
        # `--reruns`/`--only-rerun` (from pytest-rerunfailures) retries the e2e
        # demo-download test when PhysioNet returns transient network errors.
        # These are upstream failures, not real regressions, and blocking CI on
        # them means no PR can land during a bad PhysioNet minute. The pattern is
        # intentionally scoped to network-shaped failures: anything else fails
        # hard on first occurrence.
        run: |
          uv run pytest src/ tests/ -v --doctest-modules \
            --cov=src --cov-report=xml --cov-report=term \
            --junitxml=junit.xml -s \
            --reruns 3 --reruns-delay 20 \
            --only-rerun "RemoteProtocolError|ConnectError|ConnectTimeout|ReadTimeout|ReadError|HTTPStatusError|IncompleteRead|[Cc]onnection broken"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
