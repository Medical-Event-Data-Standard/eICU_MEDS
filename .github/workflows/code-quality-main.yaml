# Same as `code-quality-pr.yaml` but triggered on commit to main branch
# and runs on all files (instead of only the changed ones)

name: Code Quality Main

on:
  push:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only `pre-commit` is needed here — it provisions its own hook
      # environments, so the package itself is never imported. Installing the
      # project would also fail outright: `meds-extract` resolves from a git
      # source declared in `[tool.uv.sources]`, which pip does not read.
      - name: Install pre-commit
        run: |
          pip install 'pre-commit~=3.8'

      - name: Run pre-commits
        uses: pre-commit/action@v3.0.1
