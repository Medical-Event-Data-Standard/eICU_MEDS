name: Summary stats

# tests/regression/full_summary_stats.json fingerprints the dataset this ETL builds from the full
# eICU-CRD release. The release is credentialed, so CI cannot rebuild it: whoever changes the ETL
# regenerates the baseline where the data lives, with scripts/summary_stats.sh. This job reminds a
# pull request that changes the ETL but not the baseline. It warns rather than fails, because not
# every contributor has access to the data and not every change to src/ moves the output.

on:
  pull_request:
    branches: [main, "release/*", "dev"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pull_request checkout is a merge commit whose first parent is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Check that ETL changes regenerated the baseline
        # Documentation does not affect what the ETL writes. The suMEDS rules do: MEDS_extract-eICU
        # enriches metadata/codes.parquet with them as its last step.
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          etl=$(grep -E '^src/' <<<"$changed" | grep -vE '\.md$' || true)
          if [[ -z $etl ]]; then
            echo "No ETL changes."
          elif grep -qx 'tests/regression/full_summary_stats.json' <<<"$changed"; then
            echo "The ETL changed and tests/regression/full_summary_stats.json was regenerated."
          else
            echo "::warning title=Summary-stats baseline not regenerated::This pull request changes the ETL but not tests/regression/full_summary_stats.json. If the change moves the output, regenerate the baseline with scripts/summary_stats.sh (see the README)."
            {
              echo "### Summary-stats baseline not regenerated"
              echo
              echo "These ETL files changed, but \`tests/regression/full_summary_stats.json\` did not:"
              echo
              sed 's/^/- `/; s/$/`/' <<<"$etl"
              echo
              echo "If the change moves the output, rebuild the full release with this branch and regenerate the baseline:"
              echo
              echo '```bash'
              echo 'scripts/summary_stats.sh full --input-dir $RAW_INPUT_DIR'
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
