# Comparison policy for the summary-stats baselines in this directory, read by
# `scripts/summary_stats.sh --compare` (and by the demo regression check in CI, where there is one).
#
# Every baseline is built from a fixed release of the source data, so with the input pinned
# anything that moves in the fingerprint is something the ETL did. That is what makes a committed
# baseline meaningful, and why the cohort's content is an *error* below: a clean run reports
# nothing at all. When a change moves the output on purpose, regenerate the baseline in the same
# pull request (see scripts/summary_stats.sh).
fail_on: error

# `dataset_version` is "<release>:<ETL version>", so it changes with every ETL release, not just
# when the data does. Left at the default this would flag every comparison across versions.
on_dataset_version_change: ignore

# A key the tool no longer emits is a real signal (a stat we were watching disappeared); a new key
# is just a newer tool with more to say.
on_removed_key: error
on_added_key: warning

rules:
  # ---------------------------------------------------------------------------------------------
  # Errors: the semantic content of the dataset. With the input pinned, none of this can move
  # unless the ETL changed.
  # ---------------------------------------------------------------------------------------------

  # Volumes and the quality counters (`counts.quality.*` should sit at zero).
  - path: counts.**
    kind: exact
    on_change: error

  # The code vocabulary changed iff a digest changed.
  - path: codes.digests.**
    kind: exact
    on_change: error

  # Metadata coverage: how many codes carry a description or parent codes, and how many observed
  # codes have no metadata row at all.
  - path: code_metadata.n_codes
    kind: exact
    on_change: error

  - path: code_metadata.n_data_codes_missing_from_metadata
    kind: exact
    on_change: error

  - path: code_metadata.n_with_description
    kind: exact
    on_change: error

  - path: code_metadata.n_with_parent_codes
    kind: exact
    on_change: error

  # Split assignment is deterministic given the pinned input and the configured seed.
  - path: splits.**
    kind: exact
    on_change: error

  # Two columns disagreeing on dtype across shards is a defect at any count.
  - path: layout.column_dtype_conflicts
    kind: exact
    on_change: error

  # ---------------------------------------------------------------------------------------------
  # Warnings: real signal, but driven by things other than this repository's config.
  # ---------------------------------------------------------------------------------------------

  # Byte-level digests move whenever parquet encoding does (writer version, compression,
  # row-group boundaries), which a dependency bump can do without any ETL change.
  - path: dataset_digest.**
    kind: exact
    on_change: warning

  # Column lists are compared positionally, so one added column fans out into many findings that
  # all say the same thing (Medical-Event-Data-Standard/meds_summary_stats#6). A removed key still
  # errors via `on_removed_key`.
  - path: layout.extra_data_columns.**
    kind: exact
    on_change: warning

  # ---------------------------------------------------------------------------------------------
  # Ignored: volatile by construction, so a rule here would fire on every run.
  # ---------------------------------------------------------------------------------------------

  # `metadata/dataset.json` embeds `created_at` and the ETL version, so its digest, and the
  # metadata-wide digest covering it, differ between two runs over byte-identical input.
  - path: dataset_digest.by_file.metadata/dataset\.json
    kind: ignore

  - path: dataset_digest.dataset_metadata
    kind: ignore

  - path: dataset.etl_version
    kind: ignore

  - path: dataset.dataset_version
    kind: ignore

  - path: dataset.created_at
    kind: ignore

  - path: dataset.location_uri
    kind: ignore
