# eICU-CRD → MEDS event conversion config (MESSY syntax, MEDS-Extract 0.7).
#
# ── Subject identity ────────────────────────────────────────────────────────────
# eICU has no stable cross-stay patient identifier that is temporally orderable:
# `uniquepid` links a person across health-system stays, but those stays are ordered
# only at *year* granularity. Following the original pipeline, the MEDS subject is the
# **health system stay** (`patienthealthsystemstayid`), within which events are well
# ordered. This costs cross-stay longitudinality and is a deliberate trade.
#
# ── Pseudotimes (the reason this file looks the way it does) ────────────────────
# eICU ships no absolute timestamps: every table carries an integer *offset in minutes*
# relative to unit admission. Only the `patient` table can anchor those offsets, via:
#
#   hospital_discharge = <hospitaldischargeyear>-12-31 @ hospitaldischargetime24
#   unit_admit         = hospital_discharge - hospitaldischargeoffset minutes
#
# The Dec-31 anchor is arbitrary and constant across all subjects (it is the original
# pipeline's convention, preserved here). ONLY RELATIVE TIME DIFFERENCES ARE MEANINGFUL
# IN eICU — absolute times are not real.
#
# Under 0.7 this no longer needs a pre-MEDS pass. `_table.join` pulls the four raw
# anchor columns off `patient`, and `_table.cols` — which is applied *after* the join
# and evaluates entries in order, so later entries may reference earlier ones — rebuilds
# `unitadmittimestamp` on each table. Events then offset from it.
#
# ── `- (-$offset)::minutes` ─────────────────────────────────────────────────────
# Adding a Duration to a Datetime is what these expressions mean, but dftly's `+`
# (`Add`) lowers to `pl.sum_horizontal`, which casts operands to a common supertype and
# so fails with "casting from Duration('μs') to Datetime('μs') not supported".
# Subtraction lowers to `pl.Expr.sub`, which handles Datetime − Duration natively — so
# every "anchor + offset" is written as "anchor − (−offset)". Filed upstream; once `Add`
# lowers to `pl.Expr.add` these can all become plain `+ $offset::minutes`.
#
# ── NUMERIC-GUARD ───────────────────────────────────────────────────────────────
# `numeric_value` is strict-cast downstream, so a String source column containing any
# non-numeric row aborts the stage. Which columns are String is NOT inferable from the
# demo — it depends on what junk happens to appear — so the guarded set is taken from
# the official eICU DDL (MIT-LCP/eicu-code postgres_create_tables.sql) instead:
#
#   VARCHAR  -> age, medication.dosage, infusiondrug.{infusionrate, patientweight,
#               drugrate, drugamount, volumeoffluid}
#   NUMERIC/INT/DOUBLE -> lab.labresult, patient.{admission,discharge}{weight,height},
#               and every vitalPeriodic / vitalAperiodic measurement
#
# Only the VARCHAR columns used as `numeric_value` are guarded; the numeric-typed ones
# are passed through bare, since the upstream schema forbids junk in them and wrapping
# ~29M vitals rows would cost for nothing. (`drugrate`/`drugamount`/`volumeoffluid` are
# VARCHAR but ride along as free-text passthrough columns, which need no guard.)
#
# The guard regex is exactly Rust's `f64::from_str` grammar — optional sign, decimal or
# leading/trailing-dot forms, optional exponent, plus inf/infinity/nan — so
# `regex_extract(...)::float64` is value-for-value identical to polars'
# `cast(Float64, strict=False)`, which is what the pre-0.7 pipeline applied. A narrower
# hand-rolled pattern silently drops real values (`1e5`, `25.`, `+5`); `tests/
# test_numeric_guard.py` pins the equivalence by differential fuzzing so it cannot
# regress. inf/NaN passthrough is inherited from the old behavior and is deliberately
# NOT changed here — that belongs in its own change, not a migration.

_defaults:
  subject_id: $patienthealthsystemstayid

patient:
  _table:
    join:
      # Hospital-level attributes are static per `hospitalid` and are folded into the
      # admission code, replacing the pre-MEDS hospital join.
      hospital:
        key: hospitalid
        cols: [numbedscategory, teachingstatus, region]
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: $hospitaldischargetimestamp - $hospitaldischargeoffset::minutes
      unitdischargetimestamp: $unitadmittimestamp - (-$unitdischargeoffset)::minutes
      hospitaladmittimestamp: $unitadmittimestamp - (-$hospitaladmitoffset)::minutes
      # `age` is a string column: numeric for most subjects, the literal ">  89" for
      # HIPAA-capped ages, and empty when unknown. `regex_extract` yields null for both
      # non-numeric cases, keeping the (always-strict) `::float64` cast safe on every
      # row; the conditional then restores 90 for the capped group, as the original
      # pipeline did. Birth is assumed at the midpoint of the birth year, hence the
      # half-year (182.625 day) correction.
      age_in_years: 90 if $age == "> 89" else regex_extract("^[0-9]+$", $age)::float64
      dateofbirth: $unitadmittimestamp - ($age_in_years * 365.25 - 182.625)::days
      # A conditional with no `else` yields null when the test fails — living subjects
      # get a null death time and the extraction's computed-time filter drops the row.
      time_of_death: $hospitaldischargetimestamp if $hospitaldischargestatus == "Expired"
  dob:
    code: MEDS_BIRTH # This is the MEDS official code for birth.
    time: $dateofbirth
  gender:
    code: f"GENDER//{$gender ?? 'UNK'}"
    time: null
  ethnicity:
    code: f"RACE//{$ethnicity ?? 'UNK'}"
    time: null
  hosp_admission:
    code: >-
      f"HOSPITAL_ADMISSION//{$hospitaladmitsource ?? 'UNK'}//{$region ?? 'UNK'}//{$teachingstatus ??
      'UNK'}//{$numbedscategory ?? 'UNK'}"
    time: $hospitaladmittimestamp
    hadm_id: $hospitalid
  hosp_discharge:
    code: f"HOSPITAL_DISCHARGE//{$hospitaldischargestatus ?? 'UNK'}//{$hospitaldischargelocation ?? 'UNK'}"
    time: $hospitaldischargetimestamp
    hadm_id: $hospitalid
  unit_admission:
    code: f"ICU_ADMISSION//{$unitadmitsource ?? 'UNK'}//{$unitstaytype ?? 'UNK'}"
    time: $unitadmittimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    ward_id: $wardid
  unit_admission_weight:
    code: ICU_ADMISSION_WEIGHT
    time: $unitadmittimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    numeric_value: $admissionweight
  unit_admission_height:
    code: ICU_ADMISSION_HEIGHT
    time: $unitadmittimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    numeric_value: $admissionheight
  unit_discharge:
    code: f"ICU_DISCHARGE//{$unitdischargestatus ?? 'UNK'}//{$unitdischargelocation ?? 'UNK'}"
    time: $unitdischargetimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    ward_id: $wardid
  unit_discharge_weight:
    code: ICU_DISCHARGE_WEIGHT
    time: $unitdischargetimestamp
    numeric_value: $dischargeweight
  time_of_death:
    code: MEDS_DEATH # This is the MEDS official code for death.
    time: $time_of_death

admissionDx:
  _table:
    join: &anchor_join
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols: &anchor_cols
      unitadmittimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
        - $hospitaldischargeoffset::minutes
  admission_diagnosis:
    code: f"ADMISSION_DIAGNOSIS//{$admitdxname ?? 'UNK'}"
    time: $unitadmittimestamp - (-$admitdxenteredoffset)::minutes
    admission_dx_id: $admissiondxid
    icustay_id: $patientunitstayid

allergy:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  allergy:
    code: f"ALLERGY//{$allergytype ?? 'UNK'}"
    time: $unitadmittimestamp - (-$allergyenteredoffset)::minutes
    text_value: $allergyname

carePlanGeneral:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  cplItem:
    code: f"CAREPLAN_GENERAL//{$cplgroup ?? 'UNK'}//{$cplitemvalue ?? 'UNK'}"
    time: $unitadmittimestamp - (-$cplitemoffset)::minutes

carePlanEOL:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  cplEolDiscussion:
    code: CAREPLAN_EOL
    time: $unitadmittimestamp - (-$cpleoldiscussionoffset)::minutes

carePlanGoal:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  cplGoal:
    code: f"CAREPLAN_GOAL//{$cplgoalcategory ?? 'UNK'}//{$cplgoalvalue ?? 'UNK'}//{$cplgoalstatus ?? 'UNK'}"
    time: $unitadmittimestamp - (-$cplgoaloffset)::minutes

carePlanInfectiousDisease:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  cplInfectDisease:
    code: >-
      f"CAREPLAN_INFECTIOUS_DISEASE//{$infectdiseasesite ?? 'UNK'}//{$infectdiseaseassessment ??
      'UNK'}//{$treatment ?? 'UNK'}//{$responsetotherapy ?? 'UNK'}"
    time: $unitadmittimestamp - (-$cplinfectdiseaseoffset)::minutes

diagnosis:
  _table:
    join: *anchor_join
    # Written out rather than reusing *anchor_cols: this table needs the shared
    # pseudotime anchor *plus* the ICD split below in one `cols` mapping.
    #
    # ── ICD SPLIT ──────────────────────────────────────────────────────────────
    # Despite its name, `icd9code` holds BOTH ICD-9-CM and ICD-10-CM codes, comma-
    # separated, in one cell — 80.4% of populated cells carry both (e.g.
    # "401.9, I10", "038.9, 518.81, R65.20, J96.0"). The pre-0.7 config emitted the
    # whole cell as one opaque code, `DIAGNOSIS//ICD//9//401.9, I10`: two
    # vocabularies fused and mislabeled as ICD-9. (That bug predates the 0.7
    # migration — it is on `main` too.)
    #
    # Each cell is split into up to 7 parts (the observed maximum over the full
    # 2.7M-row release) and each part classified independently, so the emitted code
    # IS the vocabulary-qualified code — no separate `parent_codes` or `description`
    # is needed, since either would just restate it.
    #
    # Classification is by grammar, checking the ambiguous case FIRST so the later
    # branches need no negation:
    #   ICD-9-CM  : 3 digits, or E+3 digits, or V+2 digits, optional .dd
    #   ICD-10-CM : letter(A-T,V-Z) + digit + alnum, optional .xxxx
    # These overlap only on V-codes: `V08`, `V42.7`, `V42.83`, `V62.84` are valid
    # under both grammars (they are ICD-9 status codes here, but nothing in the cell
    # proves that), and `31.1` — an ICD-9 *procedure* code that leaked in — matches
    # neither. All five land in ICD_UNK rather than being silently forced either way.
    # Over the full release that is 6,444 of 4,555,096 codes (0.1%); the rest split
    # 51.1% ICD9CM / 48.8% ICD10CM.
    #
    # Every operand of `and` is parenthesised because dftly's regex-match binds
    # looser than `and` (mmcdermott/dftly#85); without the parens this fails to parse.
    #
    # 15.9% of rows across the full release carry no ICD code at all (`icd9code` is
    # the empty string — never null). Those are emitted as `UNK_DX//<path>` by the
    # `uncoded_dx` column below, so the clinical content is not lost just because
    # eICU never assigned a billing code. `UNK_DX` (no vocabulary at all) is kept
    # distinct from `ICD_UNK` (an ICD code whose vocabulary is undecidable).
    cols:
      unitadmittimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
        - $hospitaldischargeoffset::minutes
      icd_part_1: 'extract group 1 of /^(?:[^,]+,\s*){0}([^,]+)/ from $icd9code'
      icd_part_2: 'extract group 1 of /^(?:[^,]+,\s*){1}([^,]+)/ from $icd9code'
      icd_part_3: 'extract group 1 of /^(?:[^,]+,\s*){2}([^,]+)/ from $icd9code'
      icd_part_4: 'extract group 1 of /^(?:[^,]+,\s*){3}([^,]+)/ from $icd9code'
      icd_part_5: 'extract group 1 of /^(?:[^,]+,\s*){4}([^,]+)/ from $icd9code'
      icd_part_6: 'extract group 1 of /^(?:[^,]+,\s*){5}([^,]+)/ from $icd9code'
      icd_part_7: 'extract group 1 of /^(?:[^,]+,\s*){6}([^,]+)/ from $icd9code'
      icd_code_1: >-
        f"ICD_UNK/{$icd_part_1}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_1) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_1))
        else f"ICD9CM/{$icd_part_1}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_1)
        else f"ICD10CM/{$icd_part_1}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_1)
        else f"ICD_UNK/{$icd_part_1}"
      icd_code_2: >-
        f"ICD_UNK/{$icd_part_2}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_2) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_2))
        else f"ICD9CM/{$icd_part_2}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_2)
        else f"ICD10CM/{$icd_part_2}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_2)
        else f"ICD_UNK/{$icd_part_2}"
      icd_code_3: >-
        f"ICD_UNK/{$icd_part_3}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_3) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_3))
        else f"ICD9CM/{$icd_part_3}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_3)
        else f"ICD10CM/{$icd_part_3}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_3)
        else f"ICD_UNK/{$icd_part_3}"
      icd_code_4: >-
        f"ICD_UNK/{$icd_part_4}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_4) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_4))
        else f"ICD9CM/{$icd_part_4}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_4)
        else f"ICD10CM/{$icd_part_4}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_4)
        else f"ICD_UNK/{$icd_part_4}"
      icd_code_5: >-
        f"ICD_UNK/{$icd_part_5}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_5) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_5))
        else f"ICD9CM/{$icd_part_5}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_5)
        else f"ICD10CM/{$icd_part_5}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_5)
        else f"ICD_UNK/{$icd_part_5}"
      icd_code_6: >-
        f"ICD_UNK/{$icd_part_6}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_6) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_6))
        else f"ICD9CM/{$icd_part_6}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_6)
        else f"ICD10CM/{$icd_part_6}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_6)
        else f"ICD_UNK/{$icd_part_6}"
      # `diagnosisstring` is a '|'-separated clinical path present on EVERY row
      # (100% of both coded and uncoded rows, depth 3-6). Here it *is* the code,
      # so no separate `diagnosis_string` column is attached to this event.
      uncoded_dx: 'f"UNK_DX//{$diagnosisstring}" if $icd9code == ""'
      icd_code_7: >-
        f"ICD_UNK/{$icd_part_7}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_7) and (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_7))
        else f"ICD9CM/{$icd_part_7}" if (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_part_7)
        else f"ICD10CM/{$icd_part_7}" if (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_part_7)
        else f"ICD_UNK/{$icd_part_7}"
  icd_1:
    code: $icd_code_1
    time: &dx_time $unitadmittimestamp - (-$diagnosisoffset)::minutes
    diagnosis_priority: &dx_prio $diagnosispriority
    diagnosis_string: &dx_str $diagnosisstring
  icd_2:
    code: $icd_code_2
    time: *dx_time
    diagnosis_priority: *dx_prio
    diagnosis_string: *dx_str
  icd_3:
    code: $icd_code_3
    time: *dx_time
    diagnosis_priority: *dx_prio
    diagnosis_string: *dx_str
  icd_4:
    code: $icd_code_4
    time: *dx_time
    diagnosis_priority: *dx_prio
    diagnosis_string: *dx_str
  icd_5:
    code: $icd_code_5
    time: *dx_time
    diagnosis_priority: *dx_prio
    diagnosis_string: *dx_str
  icd_6:
    code: $icd_code_6
    time: *dx_time
    diagnosis_priority: *dx_prio
    diagnosis_string: *dx_str
  icd_7:
    code: $icd_code_7
    time: *dx_time
    diagnosis_priority: *dx_prio
    diagnosis_string: *dx_str
  uncoded_dx:
    code: $uncoded_dx
    time: *dx_time
    diagnosis_priority: *dx_prio

# The credentialed release spells this `infusionDrug.csv.gz`; the demo ships it
# lowercase and is normalized up to this name on download (see the `sources:` block).
infusionDrug:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  infusion:
    code: INFUSION_DRUG
    time: $unitadmittimestamp - (-$infusionoffset)::minutes
    text_value: $drugname
    drug_rate: $drugrate
    infusion_rate: $infusionrate
    drug_amount: $drugamount
    volume_of_fluid: $volumeoffluid
    # NUMERIC-GUARD (see the header note). `infusionrate` and `patientweight` are
    # VARCHAR(255) in the eICU DDL and really do carry junk — `drugrate` ships a literal
    # "ERROR" — so a bare `$infusionrate` aborts the stage on the strict cast.
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $infusionrate)::float64'
    medication_id: $infusiondrugid
  patient_weight:
    code: SUBJECT_WEIGHT_AT_INFUSION
    time: $unitadmittimestamp - (-$infusionoffset)::minutes
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $patientweight)::float64'

lab:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  lab:
    code: f"LAB//{$labname ?? 'UNK'}//{$labmeasurenamesystem ?? 'UNK'}"
    time: $unitadmittimestamp - (-$labresultoffset)::minutes
    numeric_value: $labresult
    text_value: $labresulttext
    lab_type_id: $labtypeid

medication:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  drug_started:
    code: f"MEDICATION//STARTED//{$drugname ?? 'UNK'}"
    time: $unitadmittimestamp - (-$drugstartoffset)::minutes
    # NUMERIC-GUARD (see the header note). `dosage` is VARCHAR(60) and overwhelmingly
    # free text ("1000 MG", "5,000 UNITS", "1 SPRAY") — only ~1% of demo rows are bare
    # numbers. The pre-0.7 lenient cast silently nulled the rest and this reproduces
    # that, so `numeric_value` is null for almost every medication event. The raw string
    # is preserved in `dosage` below so nothing is lost; parsing it into value + unit is
    # worth its own issue.
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $dosage)::float64'
    dosage: $dosage
    medication_id: $medicationid
  drug_stopped:
    code: f"MEDICATION//STOPPED//{$drugname ?? 'UNK'}"
    time: $unitadmittimestamp - (-$drugstopoffset)::minutes
    medication_id: $medicationid

treatment:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  treatment:
    code: f"TREATMENT//ENTERED//{$treatmentstring ?? 'UNK'}"
    time: $unitadmittimestamp - (-$treatmentoffset)::minutes
    text_value: $treatmentstring

vitalAperiodic:
  _table:
    join: *anchor_join
    cols: *anchor_cols
  non_invasive_systolic:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_SYSTOLIC"'
    time: &vap_time $unitadmittimestamp - (-$observationoffset)::minutes
    vital_id: &vap_id $vitalaperiodicid
    numeric_value: $noninvasivesystolic
  non_invasive_diastolic:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_DIASTOLIC"'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $noninvasivediastolic
  non_invasive_mean:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_MEAN"'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $noninvasivemean
  paop:
    code: '"VITALS//APERIODIC//PAOP"'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $paop
  cardiac_output:
    code: '"VITALS//APERIODIC//CARDIAC_OUTPUT"'
    time: *vap_time
