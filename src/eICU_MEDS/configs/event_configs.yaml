# How `meds-extract-run spec=eICU` runs this config (pyproject.toml registers it as `eICU`). The
# canonical extraction stages always run, between the extension stages listed here.
etl:
  dataset_name: eICU
  # MEDS-Extract treats shard size as a property of the dataset; worker counts belong to the
  # machine (`stage_runner_fp=`, see the README).
  n_subjects_per_shard: 1000
  # Written into metadata/dataset.json. There is one `etl:` block per spec, so these describe the
  # full release, also on a demo build (the demo, https://physionet.org/content/eicu-crd-demo/2.0.1/,
  # is under the Open Data Commons Open Database License v1.0).
  license: PhysioNet Credentialed Health Data License 1.5.0
  description_uri: https://physionet.org/content/eicu-crd/2.0/
  # Row ids of the raw tables the events come from. `hadm_id` holds `hospitalid` and `icustay_id`
  # holds `patientunitstayid`; `medication_id` is `medicationid` or `infusiondrugid`.
  raw_source_id_columns:
    - hadm_id
    - icustay_id
    - ward_id
    - admission_dx_id
    - medication_id
    - intake_output_id
    - nurse_assess_id
    - nurse_care_id
    - nurse_chart_id
    - past_history_id
    - physical_exam_id
    - resp_chart_id
    - vital_id
  # `diagnosis.diagnosisPriority` (Primary, Major, Other) qualifies the diagnosis code.
  code_modifier_columns:
    - diagnosis_priority
  pre_stages:
    # Writes the tables this config reads that the raw release lacks (`dx_icd_map`, the ICD codes
    # of each diagnosis path, and the packaged `lab_descriptions`); see `pre_MEDS.py`.
    - eicu_pre_meds
  post_stages:
    # Sorts each code's ICD parents by the parent code; see `sort_parent_codes.py`.
    - eicu_sort_parent_codes
    # suMEDS enriches metadata/codes.parquet in place with the rules this package registers as
    # `eICU`, and records it in metadata/dataset.json. It soft-fails (e.g. without internet);
    # `suMEDS-enrich OUTPUT_DIR` finishes it later, and `skip_stages=[sumeds_enrich]` leaves it out.
    - sumeds_enrich:
        rules: eICU

_defaults:
  subject_id: $patienthealthsystemstayid

# Descriptions. Events whose code has components describe it with an f-string `_self` template over
# those components. A literal code (`MEDS_BIRTH`, or `"VITALS//PERIODIC//HEARTRATE" if $x == $x`)
# has none, so its `_self` block is a constant, and the comment above it records the source of the
# text: `eicu-docs:<table>.<column>`, the column in the eICU-CRD table documentation
# (https://eicu.mit.edu/eicutables/); `weavehr:<concept> (<unit>)`, the WeavEHR concept and unit
# (https://github.com/aidh-ms/WeavEHR); `mimic-items:<itemid> <label>`, the MIMIC-IV d_items label
# of the item WeavEHR maps to the same concept (open MIMIC-IV demo, ODbL); `expansion`, where only
# the abbreviation is documented. Lab descriptions come from `metadata/lab_descriptions.csv`, which
# records its sources per row.

patient:
  _table:
    joins:
      hospital:
        key: hospitalid
        cols: [numbedscategory, teachingstatus, region]
    cols:
      hospitaldischargetimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
      unitadmittimestamp: $hospitaldischargetimestamp - $hospitaldischargeoffset::minutes
      unitdischargetimestamp: $unitadmittimestamp - (-$unitdischargeoffset)::minutes
      hospitaladmittimestamp: $unitadmittimestamp - (-$hospitaladmitoffset)::minutes
      age_in_years: 90 if $age == "> 89" else regex_extract("^[0-9]+$", $age)::float64
      # Anchored on the HOSPITAL admission, not the unit admission: this table is one row
      # per unit stay but a subject is a health-system stay. See "Birth" in the README.
      dateofbirth: $hospitaladmittimestamp - ($age_in_years * 365.25 + 182.625)::days
      time_of_death: $hospitaldischargetimestamp if $hospitaldischargestatus == "Expired"
  dob:
    code: MEDS_BIRTH
    time: $dateofbirth
    # Source: MEDS standard; eicu-docs:patient.age
    _metadata:
      _self:
        description: >-
          "Birth (MEDS standard code); derived from patient.age at hospital admission, see README 'Birth'"
  gender:
    code: f"GENDER//{$gender ?? 'UNK'}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient gender: {$gender ?? 'UNK'} (eICU patient.gender)"
  ethnicity:
    code: f"RACE//{$ethnicity ?? 'UNK'}"
    time: null
    _metadata:
      _self:
        description: >-
          f"Patient ethnicity: {$ethnicity ?? 'UNK'} (eICU patient.ethnicity)"
  hosp_admission:
    code: >-
      f"HOSPITAL_ADMISSION//{$hospitaladmitsource ?? 'UNK'}//{$region ?? 'UNK'}//{$teachingstatus ??
      'UNK'}//{$numbedscategory ?? 'UNK'}"
    time: $hospitaladmittimestamp
    hadm_id: $hospitalid
    _metadata:
      _self:
        description: >-
          f"Hospital admission; admitted from {$hospitaladmitsource ?? 'UNK'} (patient.hospitalAdmitSource);
          hospital region {$region ?? 'UNK'}, teaching status {$teachingstatus ?? 'UNK'}, bed count category
          {$numbedscategory ?? 'UNK'} (hospital.region, teachingStatus, numBedsCategory)"
  hosp_discharge:
    code: f"HOSPITAL_DISCHARGE//{$hospitaldischargestatus ?? 'UNK'}//{$hospitaldischargelocation ?? 'UNK'}"
    time: $hospitaldischargetimestamp
    hadm_id: $hospitalid
    _metadata:
      _self:
        description: >-
          f"Hospital discharge; patient's condition upon leaving the hospital: {$hospitaldischargestatus ?? 'UNK'}
          (patient.hospitalDischargeStatus); discharged to {$hospitaldischargelocation ?? 'UNK'}
          (patient.hospitalDischargeLocation)"
  unit_admission:
    code: f"ICU_ADMISSION//{$unitadmitsource ?? 'UNK'}//{$unitstaytype ?? 'UNK'}"
    time: $unitadmittimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    ward_id: $wardid
    _metadata:
      _self:
        description: >-
          f"ICU unit admission; admitted from {$unitadmitsource ?? 'UNK'} (patient.unitAdmitSource);
          unit stay type {$unitstaytype ?? 'UNK'} (patient.unitStayType)"
  unit_admission_weight:
    code: '"ICU_ADMISSION_WEIGHT" if $admissionweight == $admissionweight'
    time: $unitadmittimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    numeric_value: $admissionweight
    # Source: eicu-docs:patient.admissionWeight
    _metadata:
      _self:
        description: >-
          "Admission weight of the patient in kilograms (patient.admissionWeight)"
  unit_admission_height:
    code: '"ICU_ADMISSION_HEIGHT" if $admissionheight == $admissionheight'
    time: $unitadmittimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    numeric_value: $admissionheight
    # Source: eicu-docs:patient.admissionHeight
    _metadata:
      _self:
        description: >-
          "Admission height of the patient in cm (patient.admissionHeight)"
  unit_discharge:
    code: f"ICU_DISCHARGE//{$unitdischargestatus ?? 'UNK'}//{$unitdischargelocation ?? 'UNK'}"
    time: $unitdischargetimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    ward_id: $wardid
    _metadata:
      _self:
        description: >-
          f"ICU unit discharge; patient's condition upon leaving the unit: {$unitdischargestatus ?? 'UNK'}
          (patient.unitDischargeStatus); discharged to {$unitdischargelocation ?? 'UNK'}
          (patient.unitDischargeLocation)"
  unit_discharge_weight:
    code: '"ICU_DISCHARGE_WEIGHT" if $dischargeweight == $dischargeweight'
    time: $unitdischargetimestamp
    hadm_id: $hospitalid
    icustay_id: $patientunitstayid
    numeric_value: $dischargeweight
    # Source: eicu-docs:patient.dischargeWeight
    _metadata:
      _self:
        description: >-
          "Patient weight at time of unit discharge in kilograms (patient.dischargeWeight)"
  time_of_death:
    code: MEDS_DEATH
    time: $time_of_death
    # Source: MEDS standard; eicu-docs:patient.hospitalDischargeStatus
    _metadata:
      _self:
        description: >-
          "Death (MEDS standard code); hospital discharge with patient.hospitalDischargeStatus 'Expired', see README 'Death'"

admissionDx:
  _table:
    joins: &anchor_join
      patient:
        key: patientunitstayid
        cols:
          - patienthealthsystemstayid
          - hospitaldischargeyear
          - hospitaldischargetime24
          - hospitaldischargeoffset
    cols: &anchor_cols
      unitadmittimestamp: >-
        f"{$hospitaldischargeyear}-12-31 {$hospitaldischargetime24}"::"%Y-%m-%d %H:%M:%S"
        - $hospitaldischargeoffset::minutes
  admission_diagnosis:
    code: f"ADMISSION_DIAGNOSIS//{$admitdxpath ?? 'UNK'}"
    _metadata:
      _self:
        description: >-
          f"Admission diagnosis (APACHE) item path: {$admitdxpath ?? 'UNK'} (eICU admissionDx.admitDxPath)"
    time: $unitadmittimestamp - (-$admitdxenteredoffset)::minutes
    admission_dx_id: $admissiondxid
    icustay_id: $patientunitstayid

allergy:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  allergy:
    code: f"ALLERGY//{$allergytype ?? 'UNK'}"
    _metadata:
      _self:
        description: >-
          f"Allergy of type {$allergytype ?? 'UNK'} (eICU allergy.allergyType: Drug or Non Drug)"
    time: $unitadmittimestamp - (-$allergyenteredoffset)::minutes
    text_value: $allergyname

carePlanGeneral:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  cplItem:
    code: f"CAREPLAN_GENERAL//{$cplgroup ?? 'UNK'}//{$cplitemvalue ?? 'UNK'}"
    _metadata:
      _self:
        description: >-
          f"Care plan item; group {$cplgroup ?? 'UNK'} (carePlanGeneral.cplGroup): {$cplitemvalue ?? 'UNK'}
          (carePlanGeneral.cplItemValue)"
    time: $unitadmittimestamp - (-$cplitemoffset)::minutes

carePlanEOL:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  cplEolDiscussion:
    code: CAREPLAN_EOL
    time: $unitadmittimestamp - (-$cpleoldiscussionoffset)::minutes
    # Source: eicu-docs:carePlanEOL.cplEolDiscussionOffset
    _metadata:
      _self:
        description: >-
          "End-of-life discussion recorded in the care plan (carePlanEOL.cplEolDiscussionOffset)"

carePlanGoal:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  cplGoal:
    code: f"CAREPLAN_GOAL//{$cplgoalcategory ?? 'UNK'}//{$cplgoalvalue ?? 'UNK'}//{$cplgoalstatus ?? 'UNK'}"
    _metadata:
      _self:
        description: >-
          f"Care plan goal; category {$cplgoalcategory ?? 'UNK'} (carePlanGoal.cplGoalCategory):
          {$cplgoalvalue ?? 'UNK'} (carePlanGoal.cplGoalValue); status {$cplgoalstatus ?? 'UNK'}
          (carePlanGoal.cplGoalStatus: Active, Resolved or Deferred)"
    time: $unitadmittimestamp - (-$cplgoaloffset)::minutes

carePlanInfectiousDisease:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  cplInfectDisease:
    code: >-
      f"CAREPLAN_INFECTIOUS_DISEASE//{$infectdiseasesite ?? 'UNK'}//{$infectdiseaseassessment ??
      'UNK'}//{$treatment ?? 'UNK'}//{$responsetotherapy ?? 'UNK'}"
    time: $unitadmittimestamp - (-$cplinfectdiseaseoffset)::minutes
    _metadata:
      _self:
        description: >-
          f"Care plan infectious disease; site {$infectdiseasesite ?? 'UNK'} (carePlanInfectiousDisease.infectDiseaseSite);
          assessment {$infectdiseaseassessment ?? 'UNK'} (infectDiseaseAssessment); treatment {$treatment ?? 'UNK'}
          (treatment: Prophylactic, Empiric, Directed); response to therapy {$responsetotherapy ?? 'UNK'}
          (responseToTherapy)"

diagnosis:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  diagnosis:
    code: f"DIAGNOSIS//{$diagnosisstring}"
    time: $unitadmittimestamp - (-$diagnosisoffset)::minutes
    diagnosis_priority: $diagnosispriority
    _metadata:
      _self:
        description: >-
          f"Diagnosis path: {$diagnosisstring} (eICU diagnosis.diagnosisString; sections separated by '|')"
      dx_icd_map:
        diagnosisstring: $diagnosisstring
        parent_codes: >-
          f"ICD9CM/{$icd_code}" if ((/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in
          $icd_code) and (not (/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_code)))
          else f"ICD10CM/{$icd_code}" if ((/^[A-TV-Z]\d[0-9A-Z](?:\.[0-9A-Z]{1,4})?$/ in $icd_code) and
          (not (/^(?:\d{3}(?:\.\d{1,2})?|E\d{3}(?:\.\d)?|V\d{2}(?:\.\d{1,2})?)$/ in $icd_code)))

infusionDrug:
  _table:
    joins: *anchor_join
    cols:
      <<: *anchor_cols
      _patient_weight: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $patientweight)::float64'
  infusion:
    code: INFUSION_DRUG
    time: $unitadmittimestamp - (-$infusionoffset)::minutes
    text_value: $drugname
    drug_rate: $drugrate
    infusion_rate: $infusionrate
    drug_amount: $drugamount
    volume_of_fluid: $volumeoffluid
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $infusionrate)::float64'
    medication_id: $infusiondrugid
    # Source: eicu-docs:infusionDrug.drugName, infusionRate
    _metadata:
      _self:
        description: >-
          "Infusion drug administration; the drug name with its rate unit is in text_value (infusionDrug.drugName, e.g. 'Propofol (mcg/kg/min)') and numeric_value is infusionDrug.infusionRate"
  patient_weight:
    code: '"SUBJECT_WEIGHT_AT_INFUSION" if $_patient_weight == $_patient_weight'
    time: $unitadmittimestamp - (-$infusionoffset)::minutes
    numeric_value: $_patient_weight
    # Source: eicu-docs:infusionDrug.patientWeight
    _metadata:
      _self:
        description: >-
          "Patient weight recorded during the drug infusion in kilograms (infusionDrug.patientWeight)"

intakeOutput:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # One event per flowsheet row, valued by cellValueNumeric (cellValueText is the same number as
  # text). The intake/output/dialysis/net totals are not emitted: they are cumulative up to the
  # row's offset and repeated across rows entered together. Timed at entry, as for the charted
  # tables.
  intake_output:
    code: f"INTAKE_OUTPUT//{$cellpath}"
    time: $unitadmittimestamp - (-$intakeoutputentryoffset)::minutes
    numeric_value: $cellvaluenumeric
    intake_output_id: $intakeoutputid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Intake/output flowsheet item path: {$cellpath} (eICU intakeOutput.cellPath); the volume
          or weight is in numeric_value (cellValueNumeric)"

lab:
  _table:
    joins:
      <<: *anchor_join
      # The packaged lab-description table, which the `eicu_pre_meds` pre-stage writes. Keyed on
      # labname only, so a description covers every unit variant of the lab name.
      lab_descriptions:
        key: labname
        cols: [description]
    cols: *anchor_cols
  # A lab name the table does not list (or a blank one) gets a generic description. No LOINC parent
  # here: the lab-name -> LOINC crosswalk is a suMEDS crosswalk table (`eicu/lab_loinc`), applied
  # with `sumeds_rules.yaml`; see the README.
  lab_specimen_drawn:
    code: f"LAB//SPECIMEN_DRAWN//{$labname ?? 'UNK'}//{$labmeasurenamesystem ?? 'UNK'}"
    time: $unitadmittimestamp - (-$labresultoffset)::minutes
    lab_type_id: $labtypeid
    _metadata:
      _self:
        description: >-
          f"Lab specimen drawn: {$description} (eICU lab.labName '{$labname}')" if $description ==
          $description else f"Lab specimen drawn (eICU lab.labName '{$labname ?? 'UNK'}')"
  lab_result:
    code: f"LAB//RESULT//{$labname ?? 'UNK'}//{$labmeasurenamesystem ?? 'UNK'}"
    time: $unitadmittimestamp - (-$labresultrevisedoffset)::minutes
    numeric_value: $labresult
    text_value: $labresulttext
    lab_type_id: $labtypeid
    _metadata:
      _self:
        description: >-
          f"{$description} (eICU lab.labName '{$labname}')" if $description == $description else
          f"Lab result (eICU lab.labName '{$labname ?? 'UNK'}')"

medication:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # A cancelled order may or may not have been given before cancellation, and eICU does not
  # say which, so it gets its own code instead of asserting administration. See the README.
  drug_started:
    code: >-
      f"MEDICATION//ORDER_CANCELLED//{$drugname ?? 'UNK'}" if $drugordercancelled == "Yes"
      else f"MEDICATION//STARTED//{$drugname ?? 'UNK'}"
    time: $unitadmittimestamp - (-$drugstartoffset)::minutes
    _metadata:
      _self:
        description: >-
          f"Medication order cancelled (eICU medication.drugOrderCancelled), possibly after some doses:
          {$drugname ?? 'UNK'} (eICU medication.drugName)" if $drugordercancelled == "Yes"
          else f"Medication order started: {$drugname ?? 'UNK'} (eICU medication.drugName)"
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $dosage)::float64'
    dosage: $dosage
    medication_id: $medicationid
  drug_stopped:
    code: f"MEDICATION//STOPPED//{$drugname ?? 'UNK'}" if $drugordercancelled != "Yes"
    time: $unitadmittimestamp - (-$drugstopoffset)::minutes
    _metadata:
      _self:
        description: >-
          f"Medication order stopped: {$drugname ?? 'UNK'} (eICU medication.drugName)"
    medication_id: $medicationid

nurseAssessment:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # The path ends in the attribute and determines the label, so it alone is the code. The value
  # is split like the charted values, and a blank one emits nothing.
  nurse_assessment:
    code: f"NURSE_ASSESSMENT//{$cellattributepath}" if (/\S/ in $cellattributevalue)
    time: $unitadmittimestamp - (-$nurseassessentryoffset)::minutes
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $cellattributevalue)::float64'
    text_value: '$cellattributevalue if not (/^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$/ in $cellattributevalue)'
    nurse_assess_id: $nurseassessid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Nursing assessment item path: {$cellattributepath} (eICU nurseAssessment.cellAttributePath)"

nurseCare:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # Laid out like nurseAssessment: the path is the code and the value is split the same way.
  nurse_care:
    code: f"NURSE_CARE//{$cellattributepath}" if (/\S/ in $cellattributevalue)
    time: $unitadmittimestamp - (-$nursecareentryoffset)::minutes
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $cellattributevalue)::float64'
    text_value: '$cellattributevalue if not (/^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$/ in $cellattributevalue)'
    nurse_care_id: $nursecareid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Nursing care item path: {$cellattributepath} (eICU nurseCare.cellAttributePath)"

nurseCharting:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # The value cell is varchar: numbers go to numeric_value through the shared guard, anything
  # else (GCS descriptors, "Oral", "WDL") to text_value. A blank cell is no observation. Timed
  # at entry, not at the chart offset, so a value is not visible before it was recorded.
  nurse_charting:
    code: >-
      f"NURSE_CHARTING//{$nursingchartcelltypecat ?? 'UNK'}//{$nursingchartcelltypevallabel ??
      'UNK'}//{$nursingchartcelltypevalname ?? 'UNK'}" if (/\S/ in $nursingchartvalue)
    time: $unitadmittimestamp - (-$nursingchartentryoffset)::minutes
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $nursingchartvalue)::float64'
    text_value: '$nursingchartvalue if not (/^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$/ in $nursingchartvalue)'
    nurse_chart_id: $nursingchartid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Nurse-charted observation; category {$nursingchartcelltypecat ?? 'UNK'}
          (nurseCharting.nursingChartCellTypeCat), label {$nursingchartcelltypevallabel ?? 'UNK'}
          (nursingChartCellTypeValLabel), name {$nursingchartcelltypevalname ?? 'UNK'}
          (nursingChartCellTypeValName)"

pastHistory:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # The value is always the leaf of the path, so the path alone is the code; the display text
  # rides along as text_value. Timed at entry, not at the note's offset, so the history is not
  # visible before it was recorded.
  past_history:
    code: f"PAST_HISTORY//{$pasthistorypath}"
    time: $unitadmittimestamp - (-$pasthistoryenteredoffset)::minutes
    text_value: $pasthistoryvaluetext
    past_history_id: $pasthistoryid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Past history item path: {$pasthistorypath} (eICU pastHistory.pastHistoryPath)"

physicalExam:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # The path ends in the picklist choice (physicalExamValue), so the path alone is the code. The
  # entered text is the measurement for vital-sign, weight and I&O items and repeats the choice
  # otherwise; it is split like the charted values. A blank text leaves the finding valueless
  # rather than dropping it, since the path itself is the finding.
  physical_exam:
    code: f"PHYSICAL_EXAM//{$physicalexampath}"
    time: $unitadmittimestamp - (-$physicalexamoffset)::minutes
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $physicalexamtext)::float64'
    text_value: '$physicalexamtext if ((/\S/ in $physicalexamtext) and (not (/^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$/ in $physicalexamtext)))'
    physical_exam_id: $physicalexamid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Physical exam item path: {$physicalexampath} (eICU physicalExam.physicalExamPath)"

respiratoryCharting:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  # The same varchar value cell as nurseCharting, split the same way.
  respiratory_charting:
    code: >-
      f"RESPIRATORY_CHARTING//{$respcharttypecat ?? 'UNK'}//{$respchartvaluelabel ?? 'UNK'}" if (/\S/ in
      $respchartvalue)
    time: $unitadmittimestamp - (-$respchartentryoffset)::minutes
    numeric_value: 'regex_extract("^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$", $respchartvalue)::float64'
    text_value: '$respchartvalue if not (/^[+-]?(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?|[iI][nN][fF](?:[iI][nN][iI][tT][yY])?|[nN][aA][nN])$/ in $respchartvalue)'
    resp_chart_id: $respchartid
    icustay_id: $patientunitstayid
    _metadata:
      _self:
        description: >-
          f"Respiratory-charted observation; category {$respcharttypecat ?? 'UNK'}
          (respiratoryCharting.respChartTypeCat), label {$respchartvaluelabel ?? 'UNK'}
          (respChartValueLabel)"

treatment:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  treatment:
    code: f"TREATMENT//ENTERED//{$treatmentstring ?? 'UNK'}"
    time: $unitadmittimestamp - (-$treatmentoffset)::minutes
    text_value: $treatmentstring
    _metadata:
      _self:
        description: >-
          f"Treatment path: {$treatmentstring ?? 'UNK'} (eICU treatment.treatmentString)"

vitalAperiodic:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  non_invasive_systolic:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_SYSTOLIC" if $noninvasivesystolic == $noninvasivesystolic'
    time: &vap_time $unitadmittimestamp - (-$observationoffset)::minutes
    vital_id: &vap_id $vitalaperiodicid
    numeric_value: $noninvasivesystolic
    # Source: eicu-docs:vitalAperiodic.nonInvasiveSystolic; mimic-items:220179 Non Invasive Blood Pressure systolic
    _metadata:
      _self:
        description: >-
          "Non-invasive (cuff) blood pressure, systolic, mmHg (vitalAperiodic.nonInvasiveSystolic)"
  non_invasive_diastolic:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_DIASTOLIC" if $noninvasivediastolic == $noninvasivediastolic'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $noninvasivediastolic
    # Source: eicu-docs:vitalAperiodic.nonInvasiveDiastolic; mimic-items:220180 Non Invasive Blood Pressure diastolic
    _metadata:
      _self:
        description: >-
          "Non-invasive (cuff) blood pressure, diastolic, mmHg (vitalAperiodic.nonInvasiveDiastolic)"
  non_invasive_mean:
    code: '"VITALS//APERIODIC//BP//NONINVASIVE_MEAN" if $noninvasivemean == $noninvasivemean'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $noninvasivemean
    # Source: eicu-docs:vitalAperiodic.nonInvasiveMean; weavehr:mean_arterial_pressure (mmHg); mimic-items:220181 Non Invasive Blood Pressure mean
    _metadata:
      _self:
        description: >-
          "Non-invasive (cuff) blood pressure, mean, mmHg (vitalAperiodic.nonInvasiveMean)"
  paop:
    code: '"VITALS//APERIODIC//PAOP" if $paop == $paop'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $paop
    # Source: eicu-docs:vitalAperiodic.paop; mimic-items:223771 PCWP (mmHg)
    _metadata:
      _self:
        description: >-
          "Pulmonary artery occlusion (wedge) pressure (vitalAperiodic.paop)"
  cardiac_output:
    code: '"VITALS//APERIODIC//CARDIAC_OUTPUT" if $cardiacoutput == $cardiacoutput'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $cardiacoutput
    # Source: eicu-docs:vitalAperiodic.cardiacOutput; mimic-items:220088 Cardiac Output (thermodilution) (L/min)
    _metadata:
      _self:
        description: >-
          "Cardiac output (vitalAperiodic.cardiacOutput)"
  cardiac_input:
    code: '"VITALS//APERIODIC//CARDIAC_INPUT" if $cardiacinput == $cardiacinput'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $cardiacinput
    # Source: eicu-docs:vitalAperiodic.cardiacInput; expansion
    _metadata:
      _self:
        description: >-
          "Cardiac input (vitalAperiodic.cardiacInput; documented only as 'patient cardiac input value', commonly read as cardiac index)"
  svr:
    code: '"VITALS//APERIODIC//SVR" if $svr == $svr'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $svr
    # Source: eicu-docs:vitalAperiodic.svr; expansion
    _metadata:
      _self:
        description: >-
          "Systemic vascular resistance (vitalAperiodic.svr)"
  svri:
    code: '"VITALS//APERIODIC//SVRI" if $svri == $svri'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $svri
    # Source: eicu-docs:vitalAperiodic.svri; expansion; mimic-items:228185 SVRI (PiCCO)
    _metadata:
      _self:
        description: >-
          "Systemic vascular resistance index (vitalAperiodic.svri)"
  pvr:
    code: '"VITALS//APERIODIC//PVR" if $pvr == $pvr'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $pvr
    # Source: eicu-docs:vitalAperiodic.pvr; expansion
    _metadata:
      _self:
        description: >-
          "Pulmonary vascular resistance (vitalAperiodic.pvr)"
  pvri:
    code: '"VITALS//APERIODIC//PVRI" if $pvri == $pvri'
    time: *vap_time
    vital_id: *vap_id
    numeric_value: $pvri
    # Source: eicu-docs:vitalAperiodic.pvri; expansion
    _metadata:
      _self:
        description: >-
          "Pulmonary vascular resistance index (vitalAperiodic.pvri)"

vitalPeriodic:
  _table:
    joins: *anchor_join
    cols: *anchor_cols
  temperature:
    code: '"VITALS//PERIODIC//TEMPERATURE" if $temperature == $temperature'
    # `- (-x)` not `+ x`: dftly lowers Add to sum_horizontal, which cannot add a Duration
    # to a Datetime. `if $x == $x` drops rows whose cell is empty; see the README.
    time: &vp_time $unitadmittimestamp - (-$observationoffset)::minutes
    vital_id: &vp_id $vitalperiodicid
    numeric_value: $temperature
    # Source: eicu-docs:vitalPeriodic.temperature 'patient's temperature value in celsius'; weavehr:temperature (C); mimic-items:223762 Temperature Celsius
    _metadata:
      _self:
        description: >-
          "Temperature in degrees Celsius (vitalPeriodic.temperature)"
  saO2:
    code: '"VITALS//PERIODIC//SAO2" if $sao2 == $sao2'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $sao2
    # Source: eicu-docs:vitalPeriodic.saO2 'patient's spO2 value'; weavehr:oxygen_saturation (%); mimic-items:220277 O2 saturation pulseoxymetry
    _metadata:
      _self:
        description: >-
          "Pulse oximetry oxygen saturation (SpO2), % (vitalPeriodic.saO2)"
  heartRate:
    code: '"VITALS//PERIODIC//HEARTRATE" if $heartrate == $heartrate'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $heartrate
    # Source: eicu-docs:vitalPeriodic.heartRate; weavehr:heart_rate (bpm); mimic-items:220045 Heart Rate
    _metadata:
      _self:
        description: >-
          "Heart rate, beats per minute (vitalPeriodic.heartRate)"
  respiration:
    code: '"VITALS//PERIODIC//RESPIRATION" if $respiration == $respiration'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $respiration
    # Source: eicu-docs:vitalPeriodic.respiration; weavehr:respiratory_rate (insp/min); mimic-items:220210 Respiratory Rate
    _metadata:
      _self:
        description: >-
          "Respiratory rate, breaths per minute (vitalPeriodic.respiration)"
  cvp:
    code: '"VITALS//PERIODIC//CVP" if $cvp == $cvp'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $cvp
    # Source: eicu-docs:vitalPeriodic.cvp; mimic-items:220074 Central Venous Pressure (mmHg); weavehr eICU table config splits cvp at 200 into mmHg / mmH2O
    _metadata:
      _self:
        description: >-
          "Central venous pressure (vitalPeriodic.cvp); unit not documented, values above ~200 are likely mmH2O rather than mmHg"
  etCo2:
    code: '"VITALS//PERIODIC//ETCO2" if $etco2 == $etco2'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $etco2
    # Source: eicu-docs:vitalPeriodic.etCo2; mimic-items:228640 EtCO2
    _metadata:
      _self:
        description: >-
          "End-tidal carbon dioxide (vitalPeriodic.etCo2)"
  systemic_systolic:
    code: '"VITALS//PERIODIC//BP//SYSTEMIC_SYSTOLIC" if $systemicsystolic == $systemicsystolic'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $systemicsystolic
    # Source: eicu-docs:vitalPeriodic.systemicSystolic; weavehr:systolic_blood_pressure (mmHg); mimic-items:220050 Arterial Blood Pressure systolic
    _metadata:
      _self:
        description: >-
          "Systemic (invasive, arterial line) blood pressure, systolic, mmHg (vitalPeriodic.systemicSystolic)"
  systemic_diastolic:
    code: '"VITALS//PERIODIC//BP//SYSTEMIC_DIASTOLIC" if $systemicdiastolic == $systemicdiastolic'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $systemicdiastolic
    # Source: eicu-docs:vitalPeriodic.systemicDiastolic; weavehr:diastolic_blood_pressure (mmHg); mimic-items:220051 Arterial Blood Pressure diastolic
    _metadata:
      _self:
        description: >-
          "Systemic (invasive, arterial line) blood pressure, diastolic, mmHg (vitalPeriodic.systemicDiastolic)"
  systemic_mean:
    code: '"VITALS//PERIODIC//BP//SYSTEMIC_MEAN" if $systemicmean == $systemicmean'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $systemicmean
    # Source: eicu-docs:vitalPeriodic.systemicMean; weavehr:mean_arterial_pressure (mmHg); mimic-items:220052 Arterial Blood Pressure mean
    _metadata:
      _self:
        description: >-
          "Systemic (invasive, arterial line) blood pressure, mean, mmHg (vitalPeriodic.systemicMean)"
  pa_systolic:
    code: '"VITALS//PERIODIC//BP//PULM_ART_SYSTOLIC" if $pasystolic == $pasystolic'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $pasystolic
    # Source: eicu-docs:vitalPeriodic.paSystolic; mimic-items:220059 Pulmonary Artery Pressure systolic (mmHg)
    _metadata:
      _self:
        description: >-
          "Pulmonary artery pressure, systolic (vitalPeriodic.paSystolic)"
  pa_diastolic:
    code: '"VITALS//PERIODIC//BP//PULM_ART_DIASTOLIC" if $padiastolic == $padiastolic'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $padiastolic
    # Source: eicu-docs:vitalPeriodic.paDiastolic; mimic-items:220060 Pulmonary Artery Pressure diastolic (mmHg)
    _metadata:
      _self:
        description: >-
          "Pulmonary artery pressure, diastolic (vitalPeriodic.paDiastolic)"
  pa_mean:
    code: '"VITALS//PERIODIC//BP//PULM_ART_MEAN" if $pamean == $pamean'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $pamean
    # Source: eicu-docs:vitalPeriodic.paMean; mimic-items:220061 Pulmonary Artery Pressure mean (mmHg)
    _metadata:
      _self:
        description: >-
          "Pulmonary artery pressure, mean (vitalPeriodic.paMean)"
  st1:
    code: '"VITALS//PERIODIC//ST1" if $st1 == $st1'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $st1
    # Source: eicu-docs:vitalPeriodic.st1 'patient's st1 value'; expansion
    _metadata:
      _self:
        description: >-
          "ST-segment deviation, ECG lead 1 (vitalPeriodic.st1)"
  st2:
    code: '"VITALS//PERIODIC//ST2" if $st2 == $st2'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $st2
    # Source: eicu-docs:vitalPeriodic.st2; expansion
    _metadata:
      _self:
        description: >-
          "ST-segment deviation, ECG lead 2 (vitalPeriodic.st2)"
  st3:
    code: '"VITALS//PERIODIC//ST3" if $st3 == $st3'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $st3
    # Source: eicu-docs:vitalPeriodic.st3; expansion
    _metadata:
      _self:
        description: >-
          "ST-segment deviation, ECG lead 3 (vitalPeriodic.st3)"
  ICP:
    code: '"VITALS//PERIODIC//ICP" if $icp == $icp'
    time: *vp_time
    vital_id: *vp_id
    numeric_value: $icp
    # Source: eicu-docs:vitalPeriodic.ICP; mimic-items:220765 Intra Cranial Pressure (mmHg)
    _metadata:
      _self:
        description: >-
          "Intracranial pressure (vitalPeriodic.ICP)"

sources:
  # The raw release of each bucket; `meds-extract-run` stamps the selected one, with this package's
  # version, into metadata/dataset.json as `dataset_version` (e.g. `2.0.1:0.3.0` for the demo).
  dataset_version:
    dataset: "2.0"
    demo: "2.0.1"
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/eicu-crd/2.0
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      headers:
        User-Agent: Wget/1.21.4 eICU-MEDS
      # Only the tables this config reads, as for the demo below. The full release ships
      # several large tables the config never touches. The release already uses the
      # `infusionDrug` spelling, so no override.
      include:
        - patient.csv.gz
        - hospital.csv.gz
        - admissionDx.csv.gz
        - allergy.csv.gz
        - carePlanGeneral.csv.gz
        - carePlanEOL.csv.gz
        - carePlanGoal.csv.gz
        - carePlanInfectiousDisease.csv.gz
        - diagnosis.csv.gz
        - infusionDrug.csv.gz
        - intakeOutput.csv.gz
        - lab.csv.gz
        - medication.csv.gz
        - nurseAssessment.csv.gz
        - nurseCare.csv.gz
        - nurseCharting.csv.gz
        - pastHistory.csv.gz
        - physicalExam.csv.gz
        - respiratoryCharting.csv.gz
        - treatment.csv.gz
        - vitalAperiodic.csv.gz
        - vitalPeriodic.csv.gz
  demo:
    - type: physionet
      base_url: https://physionet.org/files/eicu-crd-demo/2.0.1
      headers:
        User-Agent: Wget/1.21.4 eICU-MEDS
      # Only the tables this config reads. The release also ships an 81 MB SQLite copy
      # of the same data and the excluded tables; together they are ~75% of the download,
      # which PhysioNet throttles to ~50 KB/s per connection.
      include:
        - patient.csv.gz
        - hospital.csv.gz
        - admissionDx.csv.gz
        - allergy.csv.gz
        - carePlanGeneral.csv.gz
        - carePlanEOL.csv.gz
        - carePlanGoal.csv.gz
        - carePlanInfectiousDisease.csv.gz
        - diagnosis.csv.gz
        - intakeOutput.csv.gz
        - lab.csv.gz
        - medication.csv.gz
        - nurseAssessment.csv.gz
        - nurseCare.csv.gz
        - nurseCharting.csv.gz
        - pastHistory.csv.gz
        - physicalExam.csv.gz
        - respiratoryCharting.csv.gz
        - treatment.csv.gz
        - vitalAperiodic.csv.gz
        - vitalPeriodic.csv.gz
      exclude:
        - infusiondrug.csv.gz
    - type: http
      headers:
        User-Agent: Wget/1.21.4 eICU-MEDS
      urls:
        - url: https://physionet.org/files/eicu-crd-demo/2.0.1/infusiondrug.csv.gz
          rel_path: infusionDrug.csv.gz
          sha256: 3b9f024d28682884a820763ac516ae68b247ebf17903fee4f38240c04886d527
