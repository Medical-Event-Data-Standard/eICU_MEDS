# Where the raw data lives. This block is consumed by `meds-extract-download` (invoked
# by the `MEDS_extract-eICU` runner) and is a reserved key stripped before event
# conversion, so the credential interpolations never need to be set to run the pipeline
# and never land in logs or the config copy written to the output tree.
#
# The download CLI resolves interpolations only for the selected bucket, so demo/CI runs
# never need the credential env vars below; a `key=dataset` run without them fails up
# front with a clear missing-env-var error. eICU has no external concept-map metadata to
# fetch, so there is no `common` bucket.
# The `User-Agent` is REQUIRED for the credentialed release and is not cosmetic.
# physionet.org serves credentialed paths under `/files/` only to clients whose UA
# begins with `Wget/<version>` — their documented bulk-download tool. Every other
# client is refused with a bare `403` and no `WWW-Authenticate` challenge, *before*
# credentials are considered: an unauthenticated request, a deliberately-wrong
# credential, and a correct credential are byte-identical 403s under curl's,
# httpx's, requests', or a browser's default UA. That makes the failure look like
# bad credentials or a missing data-use agreement, which is how it was first
# misdiagnosed here. httpx (what this downloader uses) is refused by default.
#
# The prefix is what PhysioNet matches, so a trailing identifier is preserved —
# `Wget/1.21.4 eICU-MEDS` satisfies their allowlist while still naming the real
# client, rather than impersonating wget outright.
sources:
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/eicu-crd/2.0
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      headers:
        User-Agent: Wget/1.21.4 eICU-MEDS
  demo:
    - type: physionet
      base_url: https://physionet.org/files/eicu-crd-demo/2.0.1
      # The open demo is served to any UA today; set the same header so the two
      # buckets do not diverge if PhysioNet ever applies the rule uniformly.
      headers:
        User-Agent: Wget/1.21.4 eICU-MEDS
      # Normalized to the full release's name by the entry below.
      exclude:
        - infusiondrug.csv.gz
    # CASING NORMALIZATION. The demo and the credentialed release disagree on the
    # case of exactly two filenames: the demo ships `infusiondrug.csv.gz` and
    # `admissiondrug.csv.gz` where the full release has `infusionDrug.csv.gz` and
    # `admissionDrug.csv.gz`. All 29 other names match byte-for-byte.
    #
    # This matters because 0.7 reads the raw download directly and resolves a table
    # by exact path (`resolve_source_files` builds `dir / f"{prefix}{ext}"`), so one
    # config prefix cannot match both. The old pipeline hid this by lowercasing every
    # prefix in pre-MEDS. The failure is at least loud — `shard_events` raises
    # `FileNotFoundError` naming the prefix — but it does block the run.
    #
    # Rather than rename the authoritative release, the *demo* is normalized up to the
    # official spelling (which is also the DDL's table name), so the credentialed
    # download stays byte-faithful and the e2e exercises this path on every CI run.
    # `admissiondrug` is deliberately left alone — no table in this config reads it.
    - type: http
      headers:
        User-Agent: Wget/1.21.4 eICU-MEDS
      urls:
        - url: https://physionet.org/files/eicu-crd-demo/2.0.1/infusiondrug.csv.gz
          rel_path: infusionDrug.csv.gz
          # Pinned because the downloader refuses to skip an existing file it cannot
          # verify, which would break every resumed run. The 2.0.1 release is immutable.
          sha256: 3b9f024d28682884a820763ac516ae68b247ebf17903fee4f38240c04886d527
