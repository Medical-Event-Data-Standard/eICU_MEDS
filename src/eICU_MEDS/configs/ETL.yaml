defaults:
  - _self_

description: |-
  This pipeline extracts raw MEDS events in longitudinal, sparse form from an input dataset meeting select
  criteria and converts them to the flattened, MEDS format.
  It can be run in its entirety, with controllable levels of parallelism, or in stages.

  Arguments:
    - `event_conversion_config_fp`: The path to the event conversion configuration file. This file defines
      the events to extract from the various rows of the various input files encountered in the global input
      directory.
    - `input_dir`: The path to the directory containing the raw input files.
    - `output_dir`: The path to the directory where the output cohort will be written. It will be written in
      various subfolders of this dir depending on the stage, as intermediate stages cache their output during
      computation for efficiency of re-running and distributing.

# The MESSY config drives every stage. 0.7 renamed this key from
# `event_conversion_config_fp` to `MESSY_config_fp`; the stages read it out of the
# pipeline config as a struct, so the old name fails with
# "Key 'MESSY_config_fp' is not in struct" rather than a legible message.
MESSY_config_fp: ${oc.env:EVENT_CONVERSION_CONFIG_FP}

input_dir: ${oc.env:PRE_MEDS_DIR}
output_dir: ${oc.env:MEDS_OUTPUT_DIR}
shards_map_fp: "${output_dir}/metadata/.shards.json"

etl_metadata:
  dataset_name: ${oc.env:DATASET_NAME}
  dataset_version: ${oc.env:DATASET_VERSION}

stages:
  # 0.7 renamed the raw-ingest stage: `shard_events` became `convert_to_parquet`, which
  # reads the raw source files into parquet before subject-sharding. Leaving the old name
  # here fails the run outright with "Stage 'shard_events' not registered!".
  # `infer_schema_length` is not a `convert_to_parquet` knob -- the 0.7 ingest derives
  # column types from the MESSY `sources:` declaration rather than by sniffing rows.
  - convert_to_parquet
  - split_and_shard_subjects:
      n_subjects_per_shard: 1000
  - convert_to_subject_sharded
  - convert_to_MEDS_events
  # `extract_code_metadata` MUST precede `merge_to_MEDS_cohort`, matching upstream's
  # canonical DEFAULT_PIPELINE. It consumes the `convert_to_MEDS_events` output, and its
  # `data_input_dir` is simply the preceding stage's output — so ordering it after the merge
  # silently pointed it at the MERGED shards instead.
  #
  # That used to work by accident: the merged output still carried the `code_components`
  # struct the metadata join matches on. MEDS-Extract #254 drops that struct at merge, so the
  # accidental wiring now matches nothing and every extracted metadata column is silently
  # dropped — `metadata/codes.parquet` comes out as just `['code']`, with exit 0 and no
  # warning. Upstream reordered its canonical pipeline in 9457866; this hand-maintained copy
  # had to follow.
  - extract_code_metadata
  - merge_to_MEDS_cohort
  - finalize_MEDS_metadata
  - finalize_MEDS_data

parallelize:
  n_workers: ${oc.env:N_WORKERS,1}
  launcher: "joblib"
