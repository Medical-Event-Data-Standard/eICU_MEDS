defaults:
  - _self_

root_output_dir: ???

raw_input_dir: ${root_output_dir}/raw_input
pre_MEDS_dir: ${root_output_dir}/pre_MEDS
MEDS_output_dir: ${root_output_dir}/MEDS_output

stage_runner_fp: null

do_download: True
do_overwrite: False
do_demo: False

# The last step enriches `metadata/codes.parquet` in place with suMEDS and the rules this package
# registers as `eICU` (LOINC parents for lab codes, parents among eICU's own path codes; see the
# README). Set False for the ETL output alone. `enrich_args` passes further `suMEDS-enrich` options,
# e.g. `'enrich_args=[--offline]'` or `'enrich_args=[--athena-csv,/path/to/athena]'`.
do_enrich: True
enrich_args: []

# Pre-MEDS passes the raw tables through untouched (it only adds the derived `dx_icd_map`
# metadata table), so they are symlinked rather than duplicated. Set True to copy instead
# — e.g. when the pipeline runs somewhere the raw directory will not stay mounted.
do_copy: False

# Number of parallel HTTPS connections used during the raw download stage. PhysioNet
# rate-limits each TCP connection to ~50 KB/s but does not throttle aggregate per-IP
# throughput, so 8 workers gives roughly 8x faster download without tripping their 429
# backoff. Set to 1 to restore strictly sequential behavior.
download_workers: 8

log_dir: ${root_output_dir}/.logs

# Hydra
hydra:
  job:
    name: full_extraction_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: ${log_dir}
  sweep:
    dir: ${log_dir}
