[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eICU-MEDS"
dynamic = ["version"]
authors = [
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" }, { name="Robin P. van de Water", email="robin.vandewater@hpi.de" }, { name="Jason Zuu" }
]
description = "An ETL pipeline to extract the eICU dataset into the MEDS format."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Each dep is pinned with a lower bound at the version we actively test against, and an
# upper bound at the next known-or-expected breaking major.
#
# INTERIM (0.7 migration): MEDS-Extract 0.7.0 is not released yet, so `meds-extract`
# resolves from the upstream `dev` branch via [tool.uv.sources] below. Git builds of
# that branch self-identify as `0.6.2.devN` (the 0.6.2 tag is not an ancestor of dev),
# so the specifier here must admit dev pre-releases; switch to
# `meds-extract[download]>=0.7.0,<0.8` and drop the git source once 0.7.0 is on PyPI.
# `meds-transforms>=0.6.7` is the floor MEDS-Extract 0.7 requires.
#
# `requests`/`beautifulsoup4` are gone: the bespoke `download.py` scraper was replaced
# by MEDS-Extract's download layer (the `[download]` extra, httpx + tenacity), driven
# by the `sources:` block in `configs/event_configs.yaml`.
dependencies = [
    "polars~=1.30",
    "meds-transforms>=0.6.7,<0.7",
    "meds-extract[download]>=0.6.2.dev0,<0.8",
    "hydra-core~=1.3",
    "hydra-joblib-launcher~=1.2",
]

[tool.uv.sources]
meds-extract = { git = "https://github.com/mmcdermott/MEDS_extract", branch = "dev" }

[dependency-groups]
# `pytest-rerunfailures` lets CI auto-retry the e2e demo download test on the narrow set
# of network exceptions seen coming out of PhysioNet (connection reset / IncompleteRead
# mid-stream) instead of turning a bad upstream minute into a failed CI build.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pytest-rerunfailures==16.1",
]

[tool.setuptools_scm]

[project.optional-dependencies]
slurm_parallelism = ["hydra-submitit-launcher~=1.2"]

[project.scripts]
MEDS_extract-eICU = "eICU_MEDS.__main__:main"

[project.urls]
Homepage = "https://github.com/Medical-Event-Data-Standard/eICU_MEDS"
Issues = "https://github.com/Medical-Event-Data-Standard/eICU_MEDS/issues"

[tool.coverage.run]
# The e2e tests exercise the runner, download, and pipeline through subprocesses (the
# `MEDS_extract-eICU` console script, which in turn spawns `meds-extract-download` and
# `MEDS_transform-pipeline`). `patch = ["subprocess"]` (coverage.py >= 7.10) propagates
# measurement into those children — transitively, since each patched process patches its
# own children — so the code they execute counts toward coverage instead of appearing
# untested.
# https://pytest-cov.readthedocs.io/en/latest/subprocess-support.html
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
