[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eICU-MEDS"
# Static so that `uv version --bump <part>` can manage it (uv cannot bump a dynamic version).
# Between releases it holds the last released version; see DEVELOPMENT.md for cutting a release.
version = "0.2.0"
authors = [
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" }, { name="Robin P. van de Water", email="robin.vandewater@hpi.de" }, { name="Jason Zuu" }
]
description = "An ETL pipeline to extract the eICU dataset into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract's own floor and ceiling. Upstream narrowed to >=3.11.4,<3.14; a
# looser range here admits interpreters it cannot be installed on, and uv refuses to
# resolve at all ("the requested Python version (>=3.11) does not satisfy Python>=3.11.4,<3.14").
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Each dep is pinned with a lower bound at the version we actively test against, and an
# upper bound at the next known-or-expected breaking major. MEDS-Extract 0.x minors are breaking
# (0.8 renamed the MESSY `_table.join` key to `_table.joins`), so raise its cap deliberately when
# migrating. 0.8.1 is the first release with extension stages (`etl.pre_stages`/`post_stages`, which
# run this package's pre-MEDS stage) and `_self` metadata on literal codes.
#
# `requests`/`beautifulsoup4` are gone: the bespoke `download.py` scraper was replaced
# by MEDS-Extract's download layer (the `[download]` extra, httpx + tenacity), driven
# by the `sources:` block in `configs/event_configs.yaml`.
# Only MEDS-Extract and the joblib launcher are declared here. `polars`, `meds-transforms`
# and `hydra-core` used to be pinned directly as well, and that is exactly the drift the
# MIMIC-IV migration warns about: MEDS-Extract already fences those, so a second copy of the
# pin goes stale independently. It did — `meds-transforms>=0.6.7,<0.7` here against
# MEDS-Extract's own `>=0.7.0,<0.8` made the project unresolvable outright. They arrive
# transitively at whatever versions MEDS-Extract fences.
#
# `hydra-joblib-launcher` stays: it is the launcher the README's parallel runs select
# (`stage_runner_fp=` with `launcher: joblib`), so it is a runtime requirement of this ETL rather
# than an upstream re-declaration.
#
# suMEDS enriches `metadata/codes.parquet` with the rules registered below. 0.6 is the first release
# that writes `parent_names` as a map from code to name; 0.6.1 adds the soft fail (a failed
# enrichment, e.g. without internet, leaves the ETL output as it was) and the `sumeds_enrichment`
# record in `metadata/dataset.json`; 0.6.2 registers the `sumeds_enrich` stage, which the spec runs
# after extraction. It is capped below the next minor because its rules format and CLI are still
# 0.x, and because each minor pins the ontology data release, and so the enriched output.
dependencies = [
    "meds-extract[download]>=0.8.1,<0.9",
    "sumeds>=0.6.2,<0.7",
    "hydra-joblib-launcher~=1.2",
]

[dependency-groups]
# `pytest-rerunfailures` lets CI auto-retry the e2e demo download test on the narrow set
# of network exceptions seen coming out of PhysioNet (connection reset / IncompleteRead
# mid-stream) instead of turning a bad upstream minute into a failed CI build.
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pytest-rerunfailures==16.1",
]

# setuptools-scm used to ship these implicitly (its git file finder), so without this list the
# wheel would build and install fine but have no ETL configs, lab descriptions or suMEDS rules.
[tool.setuptools.package-data]
eICU_MEDS = ["*.yaml", "configs/*.yaml", "metadata/*.csv"]

[project.optional-dependencies]
slurm_parallelism = ["hydra-submitit-launcher~=1.2"]

# Registers the MESSY spec with MEDS-Extract, so `meds-extract-run spec=eICU` runs it.
[project.entry-points."MEDS_extract.pipelines"]
"eICU" = "eICU_MEDS.configs:event_configs.yaml"

# Registers the suMEDS rules under the dataset's name, so the spec's `sumeds_enrich` post-stage
# and `suMEDS-enrich --rules eICU` find them.
[project.entry-points."sumeds.rules"]
"eICU" = "eICU_MEDS:sumeds_rules.yaml"

# This package's MEDS-Extract extension stages. The pre-stage writes the ICD map of the diagnosis
# codes and the packaged lab-description table (`etl.pre_stages`; see `pre_MEDS.py`); the post-stage
# sorts each code's ICD parents (`etl.post_stages`; see `sort_parent_codes.py`).
[project.entry-points."MEDS_transforms.stages"]
eicu_pre_meds = "eICU_MEDS.pre_MEDS:main"
eicu_sort_parent_codes = "eICU_MEDS.sort_parent_codes:main"

[project.urls]
Homepage = "https://github.com/Medical-Event-Data-Standard/eICU_MEDS"
Issues = "https://github.com/Medical-Event-Data-Standard/eICU_MEDS/issues"

[tool.coverage.run]
# The e2e tests exercise the download, the pipeline and this package's stages through subprocesses
# (`meds-extract-run`, which in turn spawns `meds-extract-download`, the MEDS-Transforms runner and
# one process per stage). `patch = ["subprocess"]` (coverage.py >= 7.10) propagates
# measurement into those children — transitively, since each patched process patches its
# own children — so the code they execute counts toward coverage instead of appearing
# untested.
# https://pytest-cov.readthedocs.io/en/latest/subprocess-support.html
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
